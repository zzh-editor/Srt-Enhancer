# Domain definitions for SRT enhancement
# Each domain has keywords for detection and search_context for web calibration.

domains:
  ai-3d:
    label: "AI 3D Generation"
    keywords:
      - typenow
      - tapnow
      - hyper3d
      - rodin
      - nano banana
      - comfyui
      - stable diffusion
      - seedance
      - 可灵
      - 3d 生成
      - ai 生图
      - 提示词
      - prompt
      - 三视图
      - 四视图
      - text to 3d
      - image to 3d
